<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Terra mark: glowing ring + monogram, matching the in-app header Logo().
       Hue 220 is hardcoded (the default "Midnight" theme) since a favicon can't
       read the app's live CSS custom properties. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="hsl(220, 95%, 62%)" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="hsl(220, 95%, 55%)" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="hsl(220, 95%, 55%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="hsl(220, 95%, 72%)"/>
      <stop offset="100%" stop-color="hsl(220, 85%, 50%)"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="hsl(220, 100%, 80%)"/>
      <stop offset="100%" stop-color="hsl(220, 95%, 60%)"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="hsl(220, 45%, 6%)"/>

  <!-- soft halo — the only blurred element, so downscaling to 16px doesn't
       turn crisp edges to mush along with it -->
  <circle cx="32" cy="32" r="25" fill="url(#halo)"/>

  <!-- ring, thick enough to survive shrinking to a browser tab -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="url(#ring)" stroke-width="4.5"/>

  <!-- inner disc -->
  <circle cx="32" cy="32" r="14" fill="hsl(220, 45%, 7%)"/>

  <!-- monogram -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900"
        font-size="24" fill="url(#letter)">T</text>
</svg>

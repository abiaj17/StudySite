<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Terra mark: a body and the path around it. Hue 220 is the default
       "Midnight" theme, hardcoded because a favicon cannot read the app's live
       CSS custom properties. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(220, 90%, 72%)"/>
      <stop offset="55%" stop-color="hsl(220, 85%, 62%)"/>
      <stop offset="100%" stop-color="hsl(220, 60%, 40%)"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="30%">
      <stop offset="0%" stop-color="hsl(220, 95%, 80%)"/>
      <stop offset="100%" stop-color="hsl(220, 85%, 58%)"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="hsl(220, 40%, 7%)"/>

  <!-- orbit path, tilted -->
  <ellipse cx="32" cy="32" rx="25" ry="11.5"
           transform="rotate(-28 32 32)"
           fill="none" stroke="url(#ring)" stroke-width="3.75"/>

  <!-- the body it orbits -->
  <circle cx="32" cy="32" r="9" fill="url(#core)"/>

  <!-- satellite, sitting on the path -->
  <circle cx="52.5" cy="21.5" r="4" fill="hsl(220, 95%, 82%)"/>
</svg>
